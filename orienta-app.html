<style>
:root{--bg1:#3B406F;--bg2:#1E2248;--gold:#F5B82E;--ink:#2B2F5A;--blue:#2450A8;--ring:#2F4FA0;--fg:#fff;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--fg);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:1.25rem 1.1rem 1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
h1{margin:.25rem 0 0;font-size:clamp(3rem,15vw,4.5rem);line-height:1;font-weight:700}
.sub{margin:0;font-size:clamp(1.2rem,5vw,1.5rem);color:#E6EAFB}
#talk{background:none;border:0;padding:0;margin:.4rem 0;display:flex;flex-direction:column;align-items:center;gap:.9rem;cursor:pointer;font-family:inherit;width:100%}
#talk svg{width:min(72vw,330px);height:auto}
.pill{background:var(--gold);color:#23264A;font-weight:700;font-size:clamp(1.6rem,7vw,2.1rem);padding:.7rem 1.6rem;border-radius:999px;width:100%;max-width:440px}
#talk[aria-pressed="true"] .pill{background:#fff}
#talk[aria-pressed="true"] circle.disc{fill:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;width:100%}
.tile{background:var(--blue);color:#fff;border:0;border-radius:1.1rem;padding:1rem .4rem;min-height:9rem;font:700 clamp(1.05rem,4.4vw,1.4rem)/1.2 "Atkinson Hyperlegible",Verdana,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;cursor:pointer}
.tile svg{width:2.6rem;height:2.6rem}
#out{width:100%;background:rgba(255,255,255,.1);border-left:.4rem solid var(--gold);border-radius:.6rem;padding:.8rem 1rem;font-size:1.2rem;text-align:left;min-height:4.5rem}
.cfg{background:none;border:2px solid #8FA6E0;color:#fff;border-radius:.6rem;padding:.6rem 1rem;font:inherit;font-size:1rem;cursor:pointer}
#cfg{width:100%;text-align:left;display:flex;flex-direction:column;gap:.5rem}
#cfg[hidden]{display:none}
#cfg input{font:inherit;padding:.7rem;border-radius:.5rem;border:2px solid #8FA6E0;background:#1E2248;color:#fff}
#cfg button{font:inherit;font-weight:700;padding:.7rem;border-radius:.5rem;border:0;background:#F5B82E;color:#23264A;cursor:pointer}
#cam{width:100%;max-width:320px;border-radius:1rem;background:#000}
.attr{font-size:.85rem;color:#C9D6F5;margin:0}
button:focus-visible{outline:4px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:no-preference){.pill{transition:background .15s}}
</style>
</head>
<body>
<main>
<h1>Orienta</h1>
<p class="sub">¿En qué puedo ayudarte?</p>
<button id="talk" aria-pressed="false" aria-label="Pulsa para hablar">

<path d="M50 80a36 36 0 0 0 0 40"/><path d="M34 70a52 52 0 0 0 0 60"/>

<button class="tile" data-q="buscar un lugar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>Buscar un lugar</button>

<script>
(function(){
var talk=document.getElementById("talk"),pill=document.getElementById("pilltxt"),out=document.getElementById("out");
var last="",heading=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var synth=window.speechSynthesis;
function say(t){
  last=t;out.textContent=t;
  if(!synth)return;
  try{synth.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="es-CL";u.rate=.95;synth.speak(u);}catch(e){}
}
function unlock(){try{if(synth){var u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u);}}catch(e){}}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function onHeading(e){
  if(typeof e.webkitCompassHeading==="number")heading=e.webkitCompassHeading;
  else if(e.alpha!=null)heading=(360-e.alpha)%360;
}
function startCompass(){
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(function(r){if(r==="granted")window.addEventListener("deviceorientation",onHeading,true);}).catch(function(){});
    }else{
      window.addEventListener("deviceorientationabsolute",onHeading,true);
      window.addEventListener("deviceorientation",onHeading,true);
    }
  }catch(e){}
}
function cardinal(d){return["norte","noreste","este","sureste","sur","suroeste","oeste","noroeste"][Math.round(d/45)%8];}
function place(){
  if(!navigator.geolocation){say("Este teléfono no permite conocer la ubicación.");return;}
  say("Buscando tu ubicación. Un momento.");
  navigator.geolocation.getCurrentPosition(function(p){
    var la=p.coords.latitude,lo=p.coords.longitude,ac=Math.round(p.coords.accuracy);
    var f=function(v,a,b){return Math.abs(v).toFixed(4).replace(".", " coma ")+" grados "+(v>=0?a:b);};
    say("Estás en latitud "+f(la,"norte","sur")+", longitud "+f(lo,"este","oeste")+". Precisión de unos "+ac+" metros.");
  },function(){say("No pude obtener tu ubicación. Revisa que el permiso de ubicación esté activado.");},{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
}
function answer(q){
  var s=norm(q);
  if(!s.trim()){say("No te escuché. Toca el botón y vuelve a intentarlo.");return;}
  if(/donde estoy|ubicacion|perdid|posicion/.test(s))return place();
  var cat=findCat(s);
  if(cat&&(awaiting||/cerca|donde|busca|hay un|hay una/.test(s))){awaiting=false;return searchPlaces(cat);}
  if(/buscar un lugar/.test(s)){awaiting=true;return say("Pulsa el botón grande y dime qué lugar buscas. Por ejemplo: farmacia, baño, paradero, supermercado o banco.");}
  awaiting=false;
  if(/reconocer|mi entorno|que hay delante|que hay frente|que ves/.test(s))return recognize();
  if(/hacia donde|brujula|orientacion|norte|que direccion/.test(s)){
    startCompass();
    setTimeout(function(){
      if(heading==null)say("No pude leer la brújula. Gira un poco el teléfono y pregunta de nuevo.");
      else say("Estás mirando hacia el "+cardinal(heading)+", unos "+Math.round(heading)+" grados.");
    },700);return;
  }
  if(/\bhora\b/.test(s))return say("Son las "+new Date().toLocaleTimeString("es-CL",{hour:"numeric",minute:"2-digit"})+".");
  if(/fecha|dia es hoy|que dia/.test(s))return say("Hoy es "+new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})+".");
  if(/repite|repetir|otra vez/.test(s))return say(last||"Aún no tengo nada que repetir.");
  if(/silencio|callate|detener|basta/.test(s)){if(synth)synth.cancel();out.textContent="Silencio.";return;}
  if(/^ayuda$|que puedes hacer/.test(s))return say("Puedes preguntarme lo que quieras. También: dónde estoy, hacia dónde miro, qué hora es, qué día es hoy, o repite. Para callarme, di silencio.");
  askAI(q);
}
var KEY_NAME="orienta_key",hist=[];
var SYS="Eres Orienta, un asistente por voz para personas ciegas o con baja visión. Responde siempre en español, con frases cortas y claras, máximo 3 oraciones, sin listas, sin símbolos y sin formato. No puedes ver el entorno del usuario ni garantizar su seguridad al caminar o cruzar calles: si algo es urgente o riesgoso, sugiere pedir ayuda a una persona cercana o llamar a emergencias.";
function getKey(){try{return localStorage.getItem(KEY_NAME)||"";}catch(e){return "";}}
function askAI(q){
  var key=getKey();
  if(!key){say("Para responder preguntas necesito la inteligencia artificial. Una persona de confianza debe poner la clave en el botón Configurar IA.");return;}
  say("Pensando.");
  hist.push({role:"user",parts:[{text:q}]});
  if(hist.length>7)hist=hist.slice(-7);

  .then(function(r){if(r.status===400||r.status===401||r.status===403)throw new Error("clave");if(r.status===429)throw new Error("limite");if(!r.ok)throw new Error("http");return r.json();})
  .then(function(d){var p=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];var t=p.map(function(x){return x.text||"";}).join(" ").trim()||"No tengo una respuesta para eso.";hist.push({role:"model",parts:[{text:t}]});say(t);})
  .catch(function(e){hist.pop();say(e.message==="clave"?"La clave de la inteligencia artificial no es válida. Una persona de confianza debe revisarla.":e.message==="limite"?"Se acabó el límite gratis por ahora. Intenta de nuevo en un minuto.":"No pude conectarme a la inteligencia artificial. Revisa tu internet.");});
}
function stopCam(st){var v=document.getElementById("cam");try{st.getTracks().forEach(function(t){t.stop();});}catch(e){}v.srcObject=null;v.hidden=true;}
function recognize(){
  if(!getKey()){say("Para reconocer el entorno necesito la inteligencia artificial. Una persona de confianza debe poner la clave en el botón Configurar IA.");return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say("Este navegador no permite usar la cámara.");return;}
  say("Abriendo la cámara. Apunta el teléfono hacia adelante. Tomaré la foto en unos segundos.");
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){
    var v=document.getElementById("cam");v.srcObject=st;v.hidden=false;
    var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    setTimeout(function(){
      var w=v.videoWidth,h=v.videoHeight;
      if(!w){stopCam(st);say("No pude ver la imagen. Intenta de nuevo.");return;}
      var sc=Math.min(1,768/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      var b64=c.toDataURL("image/jpeg",0.7).split(",")[1];
      stopCam(st);
      describe(b64);
    },4500);
  }).catch(function(){say("No pude abrir la cámara. Permite el acceso a la cámara en Safari e intenta de nuevo.");});
}
function describe(b64){

  .then(function(r){if(r.status===400||r.status===401||r.status===403)throw new Error("clave");if(r.status===429)throw new Error("limite");if(!r.ok)throw new Error("http");return r.json();})
  .then(function(d){var ps=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];say(ps.map(function(x){return x.text||"";}).join(" ").trim()||"No pude describir la imagen.");})

function rad(x){return x*Math.PI/180;}
function dist(a,b,c,d){var R=6371000,dp=rad(c-a),dl=rad(d-b);var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dl/2)*Math.sin(dl/2);return 2*R*Math.asin(Math.sqrt(x));}
function bear(a,b,c,d){var y=Math.sin(rad(d-b))*Math.cos(rad(c));var x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));return (Math.atan2(y,x)*180/Math.PI+360)%360;}
var MIRRORS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
function overpass(qq,i){
  i=i||0;
  if(i>=MIRRORS.length)return Promise.reject(new Error("mapa"));
  var ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},12000);
  return fetch(MIRRORS[i],{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(qq),signal:ctl?ctl.signal:undefined})
  .then(function(r){clearTimeout(t);if(!r.ok)throw new Error("http");return r.json();})
  .catch(function(){clearTimeout(t);return overpass(qq,i+1);});
}
function searchPlaces(cat){
  if(!navigator.geolocation){say("Este teléfono no permite conocer la ubicación.");return;}
  say("Buscando "+cat.n+" cerca de ti. Un momento.");
  navigator.geolocation.getCurrentPosition(function(p){
    var la=p.coords.latitude,lo=p.coords.longitude;
    var ar="(around:2500,"+la+","+lo+")";
    var qq="[out:json][timeout:20];(node"+cat.q+ar+";way"+cat.q+ar+";);out center 100;";
    overpass(qq)
    .then(function(d){
      var L=(d.elements||[]).map(function(e){var y=e.lat!=null?e.lat:(e.center&&e.center.lat),x=e.lon!=null?e.lon:(e.center&&e.center.lon);if(y==null||x==null)return null;return {n:(e.tags&&e.tags.name)||"",d:dist(la,lo,y,x),b:bear(la,lo,y,x)};}).filter(Boolean).sort(function(a,b){return a.d-b.d;});
      if(!L.length){say("No encontré "+cat.n+" en un radio de dos kilómetros y medio.");return;}
      var parts=L.slice(0,3).map(function(x,i){var m=Math.max(10,Math.round(x.d/10)*10);var w=Math.round(x.d/80);return (i===0?"El más cercano":i===1?"Luego":"Y también")+": "+(x.n?x.n+", ":"")+"a "+m+" metros hacia el "+cardinal(x.b)+(w>=2?", unos "+w+" minutos caminando":"")+".";});
      say((L.length===1?"Encontré 1 opción. ":"Encontré "+L.length+" opciones. ")+parts.join(" "));
    }).catch(function(){say("El servicio de mapas no respondió en este momento. Intenta de nuevo en unos segundos.");});
  },function(){say("No pude obtener tu ubicación. Revisa que el permiso de ubicación esté activado.");},{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
}
var rec=null,listening=false;
function listen(){
  if(!SR){say("Este navegador no permite hablar. Pide a una persona de confianza que te ayude a abrir la app en otro navegador.");return;}
  if(listening){rec&&rec.stop();return;}
  if(synth){synth.cancel();unlock();}
  rec=new SR();rec.lang="es-CL";rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=function(){listening=true;talk.setAttribute("aria-pressed","true");pill.textContent="Escuchando…";};
  rec.onresult=function(e){answer(e.results[0][0].transcript);};
  rec.onerror=function(e){
    if(e.error==="not-allowed"||e.error==="service-not-allowed")say("No puedo usar el micrófono en esta versión de prueba. Pide a una persona de confianza que te ayude a abrir la versión completa.");
    else if(e.error==="no-speech")say("No te escuché. Toca el botón y habla de nuevo.");
    else say("Hubo un problema con el micrófono. Intenta otra vez.");
  };
  rec.onend=function(){listening=false;talk.setAttribute("aria-pressed","false");pill.textContent="Pulsa para hablar";};
  try{rec.start();}catch(e){}
}
talk.addEventListener("click",listen);
